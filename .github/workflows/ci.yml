name: CI

# Guards main: every push and pull request builds, vets, and tests the
# module on Linux and macOS, then runs golangci-lint + govulncheck on Linux.
#
# NOTE: the gh and claude CLIs are NOT available in CI. The test suite is
# hermetic — any test that genuinely needs an external binary or the network
# skips itself when the binary is absent. Do not add gh/claude here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build / vet / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + cover)
        run: go test -race -cover ./...

  lint:
    name: golangci-lint + govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
