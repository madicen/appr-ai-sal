name: Release

# Manual release pipeline.
#
# Trigger from the GitHub Actions UI: pick the branch (typically `main`),
# enter the new tag (e.g. `v0.1.0`), and run. The workflow validates the
# tag, creates and pushes it on the chosen ref, then runs GoReleaser
# which builds cross-platform binaries, publishes a GitHub release, and
# updates the Homebrew cask in `madicen/homebrew-tap`.
#
# Requires repo secret: HOMEBREW_TAP_GITHUB_TOKEN (PAT with `contents: write`
# on `madicen/homebrew-tap`).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0 or v0.1.0-rc1). Created on the selected ref.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          tag='${{ inputs.tag }}'
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-rc1 (got: $tag)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag does not already exist
        run: |
          tag='${{ inputs.tag }}'
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists locally"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists on origin"
            exit 1
          fi

      - name: Create and push tag
        run: |
          tag='${{ inputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
