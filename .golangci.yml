# golangci-lint configuration.
#
# Modest, non-breaking starting set (grow later — see docs/IMPROVEMENT_PLAN.md
# Phase 0.1). govet / staticcheck / unused / errcheck / ineffassign / misspell.

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
