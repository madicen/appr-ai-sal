# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: appr-ai-sal

before:
  hooks:
    - go mod tidy

builds:
  - id: appr-ai-sal
    main: ./cmd/appr-ai-sal
    binary: appr-ai-sal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: appr-ai-sal
    repository:
      owner: madicen
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/madicen/appr-ai-sal"
    description: "Specialist AI code reviews for your GitHub PRs, in the terminal"
    license: "MIT"
    binaries:
      - appr-ai-sal
    # gh is the only hard runtime dep we can install via brew — the AI backend
    # (claude CLI / Ollama / Gemini / OpenAI-compatible) is the user's choice
    # and is configured at runtime, so we don't pin one here.
    dependencies:
      - formula: gh
    # Unsigned GitHub release binaries are quarantined on macOS. Quarantine
    # alone is not enough on recent macOS: Gatekeeper SIGKILLs the
    # linker/ad-hoc signature (Code Signature Invalid). Strip quarantine and
    # re-sign ad-hoc in preflight. Proper fix later: Developer ID + notarization.
    caveats: |
      On macOS, if Gatekeeper blocks a GitHub/direct download ("Not Opened" /
      Code Signature Invalid), clear quarantine and re-sign ad-hoc:

        xattr -dr com.apple.quarantine "$(which appr-ai-sal)"
        codesign --force --sign - "$(which appr-ai-sal)"

      Or use System Settings → Privacy & Security → Open Anyway.
      Prefer `brew install --cask madicen/tap/appr-ai-sal` (cask preflight handles this).
    # GoReleaser ~> v2 currently resolves to v2.18.x, which accepts raw Ruby
    # under hooks.pre.install (system_command / #{staged_path}). install_steps
    # (run / {{ .StagedPath }}) arrives in v2.19 — switch back when CI bumps.
    hooks:
      pre:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/appr-ai-sal"]
            system_command "/usr/bin/codesign", args: ["--force", "--sign", "-", "#{staged_path}/appr-ai-sal"]
          end

release:
  github:
    owner: madicen
    name: appr-ai-sal
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
